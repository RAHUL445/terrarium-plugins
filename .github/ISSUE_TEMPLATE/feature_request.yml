name: Feature request
description: Suggest an idea for the host or plugin API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Could it be a plugin instead of a host change?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
