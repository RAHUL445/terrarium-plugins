version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /packages/bookmarks
      - /packages/habits
      - /packages/notes
      - /packages/reports
      - /packages/todo
      - /packages/voice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
