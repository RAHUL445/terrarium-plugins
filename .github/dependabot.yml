version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /packages/bookmarks
      - /packages/habits
      - /packages/notes
      - /packages/reports
      - /packages/todo
      - /packages/voice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one weekly PR. Major versions are
    # upgraded deliberately, together with the vendored SDK.
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
