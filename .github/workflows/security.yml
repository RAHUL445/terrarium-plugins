name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        run: python3 scripts/install-gitleaks.py "$RUNNER_TEMP/secret-scanner"
      - name: Scan commit history with redaction
        run: '"$RUNNER_TEMP/secret-scanner/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
      - name: Install pinned RustSec scanner outside the checkout
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/security-tools"
      - name: Audit locked dependencies (no advisory ignores)
        run: |
          for manifest in packages/*/Cargo.toml; do
            "$RUNNER_TEMP/security-tools/bin/cargo-audit" audit --file "${manifest%Cargo.toml}Cargo.lock" --deny unsound --deny yanked
          done
