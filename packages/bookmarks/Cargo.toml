[package]
name = "bookmarks"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Each plugin is its own workspace, built for wasm32-unknown-unknown.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
terrarium-guest = { path = "../../vendor/terrarium-sdk/crates/guest" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
