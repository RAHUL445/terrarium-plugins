[package]
name = "feeds"
version = "0.2.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
terrarium-guest = { path = "../../vendor/terrarium-sdk/crates/guest" }
serde_json = "1"
quick-xml = "0.41"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
