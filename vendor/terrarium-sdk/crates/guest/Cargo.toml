[package]
name = "terrarium-guest"
description = "SDK for writing Terrarium plugins as Wasm components"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Built for wasm32-unknown-unknown by each plugin; not part of the host workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"
